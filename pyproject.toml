[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jakarta-flood-risk"
version = "0.1.0"
description = "Reference CNN-LSTM workflow for neighbourhood-scale flood-risk modelling in Jakarta"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
  {name = "Jin Rui"},
  {name = "Zahratu Shabrina"},
  {name = "Emma Colven"},
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "tensorflow>=2.15,<2.19",
]

[project.optional-dependencies]
notebooks = [
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "pillow>=10",
  "planetary-computer>=1.0",
  "pystac-client>=0.7",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "scikit-image>=0.22",
  "xarray>=2024.1",
  "jupyterlab>=4",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

